# Steam Frame desktop mode: KWin runs nested inside gamescope, which gives it a 1920x1080
# frame (--nested-width/--nested-height). Without a size, KWin defaults to 1024x768 (4:3),
# which gamescope pillarboxes -> black bars left and right. Match gamescope's 16:9 frame.
# Logged in ~/Works/Frame/changes/04-desktop-resolution.md
[Service]
ExecStart=
ExecStart=/usr/bin/kwin_wayland_wrapper --xwayland --width 1920 --height 1080
